[package]
name = "catwalk"
version = "0.1.0"
edition = "2021"
description = "Terminal viewer for agent-owned TODO lists"
authors = ["John Anthony Mariquit <john@mariquit.com>"]
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "catwalk"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
notify = "6.1"
ratatui = "0.29"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
